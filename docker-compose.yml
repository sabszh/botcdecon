version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      RETRIEVER_PROVIDER: ${RETRIEVER_PROVIDER:-local}
      DATA_JSON_PATH: ${DATA_JSON_PATH:-data/all.json}
      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://127.0.0.1:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    profiles:
      - dev
